{% extends "base.html" %}
{% block title %}Edit Resident - SAMs{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4 shadow-sm border-warning">
            <h4 class="text-warning mb-3">✏️ Edit Resident (ID: {{ resident.resident_id }})</h4>
            <form action="/residents/edit/{{ resident.resident_id }}" method="POST">
                <div class="mb-3">
                    <label class="form-label text-secondary small">Full Name</label>
                    <input type="text" class="form-control" name="name" value="{{ resident.name }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label text-secondary small">Apartment Number</label>
                    <input type="text" class="form-control" name="apartment_no" value="{{ resident.apartment_no }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label text-secondary small">Contact Number</label>
                    <input type="text" class="form-control" name="contact_no" value="{{ resident.contact_no }}" minlength="10" required>
                </div>
                <div class="mb-3">
                    <label class="form-label text-secondary small">Email</label>
                    <input type="email" class="form-control" name="email" value="{{ resident.email }}" required>
                </div>
                <div class="d-flex justify-content-between">
                    <a href="/manager" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" class="btn btn-warning fw-semibold text-dark">Update Resident</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
