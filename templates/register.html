{% extends "base.html" %}
{% block title %}Resident Self-Registration - SAMs{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4 shadow-lg border-info">
            <h3 class="text-info mb-2">📝 Resident Self-Registration</h3>
            <p class="text-muted small mb-4">Register your apartment to request amenity access. Your application will be sent to the Society Manager for verification.</p>
            
            <form action="/register" method="POST">
                <div class="mb-3">
                    <label class="form-label text-secondary small">Resident ID</label>
                    <input type="number" class="form-control" name="resident_id" placeholder="e.g. 108" required>
                </div>
                <div class="mb-3">
                    <label class="form-label text-secondary small">Full Name</label>
                    <input type="text" class="form-control" name="name" placeholder="e.g. Kaustubh Sinha" required>
                </div>
                <div class="mb-3">
                    <label class="form-label text-secondary small">Apartment Unit</label>
                    <input type="text" class="form-control" name="apartment_no" placeholder="e.g. C-404" required>
                </div>
                <div class="mb-3">
                    <label class="form-label text-secondary small">Contact Number (10+ digits)</label>
                    <input type="text" class="form-control" name="contact_no" placeholder="e.g. 9876543210" minlength="10" required>
                </div>
                <div class="mb-3">
                    <label class="form-label text-secondary small">Email Address</label>
                    <input type="email" class="form-control" name="email" placeholder="e.g. user@society.com" required>
                </div>
                <button type="submit" class="btn btn-info text-dark fw-bold w-100 py-2">Submit Registration for Approval</button>
            </form>
            
            <div class="text-center mt-3">
                <a href="/manager" class="text-muted small">← Back to Dashboard</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
